name: Bootstrap first npm publication

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'inkrajs/inkra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-bootstrap
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify original candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/inkrajs/inkra/actions/artifacts/12372033672 > "$RUNNER_TEMP/candidate-artifact.json"
          gh api 'repos/inkrajs/inkra/actions/runs/39656403601/jobs?filter=all' > "$RUNNER_TEMP/candidate-jobs.json"
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { readFileSync } from 'node:fs';
            const artifact = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/candidate-artifact.json'));
            assert.equal(artifact.name, 'npm-candidate');
            assert.equal(artifact.expired, false);
            assert.equal(artifact.workflow_run.id, 39656403601);
            assert.equal(artifact.workflow_run.head_sha, '3f3af14a9f6db230cf39db2c7fe5b30e606795f3');
            const { jobs } = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/candidate-jobs.json'));
            assert(jobs.some(job => job.name === 'validate' && job.conclusion === 'success'));
          "
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v0.1.0
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: python3 scripts/test/bootstrap-publish.test.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '12372033672'
          run-id: '39656403601'
          github-token: ${{ github.token }}
          path: source/.release
          merge-multiple: true
      - name: Check immutable source and archive
        working-directory: source
        env:
          RELEASE_ACTION: publish
          GITHUB_REF: refs/tags/v0.1.0
          GITHUB_SHA: 3f3af14a9f6db230cf39db2c7fe5b30e606795f3
        run: node scripts/release.mjs candidate
      - name: Start official npm web authorization
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_BROWSER: 'false'
        run: python3 scripts/bootstrap-publish.py start "$RUNNER_TEMP/npm-bootstrap" "$GITHUB_WORKSPACE/source"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-approval
          path: ${{ runner.temp }}/npm-bootstrap/approval.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Wait for npm authorization and publication
        run: python3 scripts/bootstrap-publish.py wait "$RUNNER_TEMP/npm-bootstrap" "$GITHUB_WORKSPACE/source"
      - name: Check published registry archive
        working-directory: source
        env:
          RELEASE_ACTION: verify
          GITHUB_REF: refs/tags/v0.1.0
          GITHUB_SHA: 3f3af14a9f6db230cf39db2c7fe5b30e606795f3
        run: node scripts/release.mjs verify
