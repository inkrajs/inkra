name: Release npm package

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate only, publish with OIDC, stage the first package, or verify an approved stage
        required: true
        type: choice
        default: validate
        options: [validate, publish, bootstrap-stage, verify]
      docs_ref:
        description: Exact inkrajs/docs commit used to test this candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_ACTION: ${{ inputs.action || 'validate' }}
  DOCS_REF: ${{ inputs.docs_ref }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin the npm CLI used to create and publish the archive
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Check release source and version policy
        id: source
        run: node scripts/release.mjs source
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify the same archive with React 18
        run: npm run check:installed
        env:
          REACT_VERSION: 18.3.1
      - name: Verify candidate identity
        run: node scripts/release.mjs candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate
          path: |
            .release/*.tgz
            .release/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  hydration:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: .release
      - run: npm ci --ignore-scripts
      - name: Verify preinstalled browser runtime
        run: node scripts/check-browser-runtime.mjs
      - name: Hydrate the same archive with React 18 and 19
        run: |
          REACT_VERSION=18.3.1 node scripts/check-installed.mjs --browser
          REACT_VERSION=19.3.1 node scripts/check-installed.mjs --browser

  docs-build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: .release
      - name: Verify immutable candidate identity
        run: node scripts/release.mjs candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inkrajs/docs
          ref: ${{ env.DOCS_REF }}
          path: .consumer
          persist-credentials: false
      - name: Require docs sharding support
        working-directory: .consumer
        run: |
          test -f scripts/check-browser-reports.mjs
          test -f scripts/run-browser-ci.sh
          test -f scripts/test/icon-edge-baseline.test.mjs
          node --test scripts/test/browser-report.test.mjs scripts/test/browser-incremental-workflow.test.mjs scripts/test/icon-edge-baseline.test.mjs
          BROWSER_SHARD=1/4 BROWSER_INCLUDE_HOMEPAGE=true node scripts/browser-smoke.mjs --list
      - name: Prepare this exact archive in the docs consumer
        run: npm run prepare:library -- .. --lockfile-only
        working-directory: .consumer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .consumer/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .consumer
      - run: npm run build
        working-directory: .consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-docs-input
          path: |
            .consumer/package.json
            .consumer/package-lock.json
            .consumer/library-candidate.json
            .consumer/vendor/*.tgz
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-docs-build
          path: .consumer/dist/
          include-hidden-files: true
          if-no-files-found: error

  browser:
    needs: docs-build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inkrajs/docs
          ref: ${{ env.DOCS_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-docs-input
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify preinstalled browser runtime
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { createRequire } from 'node:module';
            import { chromium } from 'playwright';
            assert.equal(createRequire(import.meta.url)('playwright/package.json').version, '1.64.1', 'Update the pinned browser image with Playwright');
            const browser = await chromium.launch({ headless: true });
            console.log('Preinstalled Chromium ' + browser.version());
            await browser.close();
          "
      - name: Validate installed-package browser interactions
        run: bash scripts/run-browser-ci.sh
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/4
          BROWSER_INCLUDE_HOMEPAGE: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-browser-report-${{ matrix.shard }}
          path: .ci-results/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  docs-verified:
    needs: [validate, hydration, docs-build, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite
        env:
          PACKAGE_RESULT: ${{ needs.validate.result }}
          HYDRATION_RESULT: ${{ needs.hydration.result }}
          BUILD_RESULT: ${{ needs.docs-build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$PACKAGE_RESULT" = success && test "$HYDRATION_RESULT" = success && test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inkrajs/docs
          ref: ${{ env.DOCS_REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-browser-report-*
          path: .ci-results
          merge-multiple: true
      - name: Require complete browser coverage
        run: node scripts/check-browser-reports.mjs .ci-results 4
        env:
          BROWSER_INCLUDE_HOMEPAGE: 'true'

  publish:
    needs: [validate, docs-verified]
    if: inputs.action != 'validate' && inputs.action != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: .release
      - name: Publish the verified tarball with OIDC
        if: env.RELEASE_ACTION == 'publish'
        run: node scripts/release.mjs publish
      - name: Stage the first package for npm approval
        if: env.RELEASE_ACTION == 'bootstrap-stage'
        run: node scripts/release.mjs bootstrap-stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

  verify:
    needs: [validate, docs-verified, publish]
    if: >-
      always() && needs.validate.result == 'success' &&
      needs.docs-verified.result == 'success' &&
      (inputs.action == 'verify' ||
      (needs.publish.result == 'success' && inputs.action != 'bootstrap-stage'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ['18.3.1', '19.3.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: .release
      - name: Compare the public archive with the approved candidate
        run: node scripts/release.mjs verify
      - name: Install from the public registry and verify exports, types and assets
        run: node scripts/check-installed.mjs --registry
        env:
          REACT_VERSION: ${{ matrix.react }}

  github-release:
    needs: [validate, verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate
          path: .release
      - name: Create a release only after registry verification succeeds
        run: node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
