name: Release npm package

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate only, publish with OIDC, stage the first package, or verify an approved stage
        required: true
        type: choice
        default: validate
        options: [validate, publish, bootstrap-stage, verify]
      docs_ref:
        description: Exact inkrajs/docs commit used to test this candidate
        required: true
        type: string
      local_validation_pr:
        description: Optional inkrajs/docs PR containing a local-test declaration for docs_ref (otherwise discover its PR)
        required: false
        type: string
        default: ''
      component_validation_pr:
        description: Optional inkrajs/inkra PR containing local component-test declarations for the selected release source
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_ACTION: ${{ inputs.action || 'validate' }}
  DOCS_REF: ${{ inputs.docs_ref }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin the npm CLI used to create and publish the archive
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Check release source and version policy
        id: source
        run: node scripts/release.mjs source
      - run: npm ci --ignore-scripts
      - name: Resolve trusted component local-test declaration
        id: component-local
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ inputs.component_validation_pr }}
          OUTPUT_PATH: .release/component-local-validation.json
        run: node scripts/resolve-pr-local-validation.mjs
      - run: npm run check
        if: steps.component-local.outputs.accepted != 'true'
      - name: Required contracts and locally confirmed component inventory
        if: steps.component-local.outputs.accepted == 'true'
        env:
          REACT_VERSION: 19.3.1
        run: |
          npm run check:contracts
          LOCAL_VALIDATION_REPORT=.release/component-local-validation.json node scripts/component-local-validation.mjs
      - name: Verify the same archive with React 18
        run: npm run check:installed
        env:
          REACT_VERSION: 18.3.1
      - name: Verify candidate identity
        run: node scripts/release.mjs candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-component-local-validation
          path: .release/component-local-validation*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate
          path: |
            .release/*.tgz
            .release/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  hydration:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: .release
      - run: npm ci --ignore-scripts
      - name: Verify preinstalled browser runtime
        run: node scripts/check-browser-runtime.mjs
      - name: Hydrate the same archive with React 18 and 19
        run: |
          REACT_VERSION=18.3.1 node scripts/check-installed.mjs --browser
          REACT_VERSION=19.3.1 node scripts/check-installed.mjs --browser

  docs-build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      browser_matrix: ${{ steps.browser-plan.outputs.matrix }}
      browser_shard_count: ${{ steps.browser-plan.outputs.shard_count }}
      browser_selected_count: ${{ steps.browser-plan.outputs.selected_count }}
      browser_plan_digest: ${{ steps.browser-plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: .release
      - name: Verify immutable candidate identity
        run: node scripts/release.mjs candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inkrajs/docs
          ref: ${{ env.DOCS_REF }}
          path: .consumer
          persist-credentials: false
      - name: Require docs sharding support
        working-directory: .consumer
        run: |
          test -f scripts/check-browser-reports.mjs
          test -f scripts/run-browser-ci.sh
          test -f scripts/browser-local-validation.mjs
          test -f scripts/test/icon-edge-baseline.test.mjs
          node --test scripts/test/browser-report.test.mjs scripts/test/browser-incremental-workflow.test.mjs scripts/test/icon-edge-baseline.test.mjs scripts/test/browser-local-validation.test.mjs
          BROWSER_SHARD=1/4 BROWSER_INCLUDE_HOMEPAGE=true node scripts/browser-smoke.mjs --list
      - name: Prepare this exact archive in the docs consumer
        run: npm run prepare:library -- .. --lockfile-only
        working-directory: .consumer
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .consumer/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .consumer
      - run: npm run build
        working-directory: .consumer
      - name: Bind local confirmations to the verified release archive
        shell: bash
        run: |
          node -e 'const fs=require("fs");const sha=JSON.parse(fs.readFileSync(".release/manifest.json")).sha256;if(!/^[0-9a-f]{64}$/.test(sha))throw Error("Invalid candidate digest");fs.appendFileSync(process.env.GITHUB_ENV,"EXPECTED_CANDIDATE_SHA256="+sha+"\n")'
      - name: Resolve trusted docs local-test declaration
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: inkrajs/docs
          TARGET_SHA: ${{ env.DOCS_REF }}
          PR_NUMBER: ${{ inputs.local_validation_pr }}
          OUTPUT_PATH: .consumer/.ci-plan/local-validation.json
        run: node scripts/resolve-pr-local-validation.mjs
      - name: Plan release browser coverage and apply exact local confirmations
        id: browser-plan
        working-directory: .consumer
        env:
          BROWSER_INCLUDE_HOMEPAGE: 'true'
        shell: bash
        run: |
          base="$(node -e 'const r=require("./.ci-plan/local-validation.json");console.log(r.base || process.env.DOCS_REF)')"
          node scripts/select-browser-checks.mjs --event release --base "$base" --tested "$DOCS_REF" --output .ci-plan/browser-selection.json
          node scripts/browser-local-validation.mjs --plan .ci-plan/browser-selection.json --attestation .ci-plan/local-validation.json --environment chromium-playwright1.64.1-react19.3.1 --candidate library-candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-browser-plan
          path: .consumer/.ci-plan/*.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-docs-input
          path: |
            .consumer/package.json
            .consumer/package-lock.json
            .consumer/library-candidate.json
            .consumer/vendor/*.tgz
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-docs-build
          path: .consumer/dist/
          include-hidden-files: true
          if-no-files-found: error

  browser:
    needs: docs-build
    if: needs.docs-build.outputs.browser_selected_count != '0'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.docs-build.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inkrajs/docs
          ref: ${{ env.DOCS_REF }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-docs-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-browser-plan
          path: .ci-plan
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Verify preinstalled browser runtime
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { createRequire } from 'node:module';
            import { chromium } from 'playwright';
            assert.equal(createRequire(import.meta.url)('playwright/package.json').version, '1.64.1', 'Update the pinned browser image with Playwright');
            const browser = await chromium.launch({ headless: true });
            console.log('Preinstalled Chromium ' + browser.version());
            await browser.close();
          "
      - name: Validate installed-package browser interactions
        run: bash scripts/run-browser-ci.sh
        env:
          BROWSER_SHARD: ${{ matrix.shard }}/${{ needs.docs-build.outputs.browser_shard_count }}
          BROWSER_SELECTION_PLAN: .ci-plan/browser-selection.json
          EXPECTED_BROWSER_PLAN_DIGEST: ${{ needs.docs-build.outputs.browser_plan_digest }}
          EXPECTED_TESTED_REVISION: ${{ env.DOCS_REF }}
          BROWSER_INCLUDE_HOMEPAGE: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-browser-report-${{ matrix.shard }}
          path: .ci-results/
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  docs-verified:
    needs: [validate, hydration, docs-build, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite
        env:
          PACKAGE_RESULT: ${{ needs.validate.result }}
          HYDRATION_RESULT: ${{ needs.hydration.result }}
          BUILD_RESULT: ${{ needs.docs-build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SELECTED_COUNT: ${{ needs.docs-build.outputs.browser_selected_count }}
        shell: bash
        run: |
          test "$PACKAGE_RESULT" = success
          test "$HYDRATION_RESULT" = success
          test "$BUILD_RESULT" = success
          [[ "$BROWSER_RESULT" = success || ( "$SELECTED_COUNT" = 0 && "$BROWSER_RESULT" = skipped ) ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: inkrajs/docs
          ref: ${{ env.DOCS_REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-browser-plan
          path: .ci-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: .release
      - name: Bind coverage gate to the verified candidate digest
        shell: bash
        run: |
          node -e 'const fs=require("fs");const sha=JSON.parse(fs.readFileSync(".release/manifest.json")).sha256;if(!/^[0-9a-f]{64}$/.test(sha))throw Error("Invalid candidate digest");fs.appendFileSync(process.env.GITHUB_ENV,"EXPECTED_CANDIDATE_SHA256="+sha+"\n")'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.docs-build.outputs.browser_selected_count != '0'
        with:
          pattern: release-browser-report-*
          path: .ci-results
          merge-multiple: true
      - name: Require complete browser coverage
        run: node scripts/check-browser-reports.mjs .ci-results .ci-plan/browser-selection.json
        env:
          BROWSER_JOB_RESULT: ${{ needs.browser.result }}
          EXPECTED_BROWSER_PLAN_DIGEST: ${{ needs.docs-build.outputs.browser_plan_digest }}
          EXPECTED_TESTED_REVISION: ${{ env.DOCS_REF }}
          BROWSER_INCLUDE_HOMEPAGE: 'true'

  publish:
    needs: [validate, docs-verified]
    if: inputs.action != 'validate' && inputs.action != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: .release
      - name: Publish the verified tarball with OIDC
        if: env.RELEASE_ACTION == 'publish'
        run: node scripts/release.mjs publish
      - name: Stage the first package for npm approval
        if: env.RELEASE_ACTION == 'bootstrap-stage'
        run: node scripts/release.mjs bootstrap-stage
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}

  verify:
    needs: [validate, docs-verified, publish]
    if: >-
      always() && needs.validate.result == 'success' &&
      needs.docs-verified.result == 'success' &&
      (inputs.action == 'verify' ||
      (needs.publish.result == 'success' && inputs.action != 'bootstrap-stage'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ['18.3.1', '19.3.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: .release
      - name: Compare the public archive with the approved candidate
        run: node scripts/release.mjs verify
      - name: Install from the public registry and verify exports, types and assets
        run: node scripts/check-installed.mjs --registry
        env:
          REACT_VERSION: ${{ matrix.react }}

  github-release:
    needs: [validate, verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: .release
      - name: Create a release only after registry verification succeeds
        run: node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
